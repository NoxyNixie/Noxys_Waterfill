[mod-setting-description]
Noxys_Waterfill-enable-waterfill=Aktiverar en variant med vanligt vatten.
Noxys_Waterfill-enable-deepwaterfill=Aktiverar en variant med djupt vatten.
Noxys_Waterfill-enable-waterfill-green=Aktiverar varianten med grönt vatten. Denna variant är alltid grön, oavsett föroreningsnivå.
Noxys_Waterfill-enable-deepwaterfill-green=Aktiverar varianten med djupt grönt vatten. Denna variant är alltid grön, oavsett föroreningsnivå.
Noxys_Waterfill-enable-shallowwaterfill=Aktiverar en variant med grunt vatten.
Noxys_Waterfill-enable-mudwaterfill=Aktiverar en variant med lerigt vatten.
Noxys_Waterfill-require-research=När detta är aktiverat måste recepten för vattenfyllning låsas upp genom forskning.
Noxys_Waterfill-green-water-requires-uranium=När detta är aktiverat krävs uran-238 för att tillverka grön vattenfyllning.
Noxys_Waterfill-recipe-difficulty=Svårighetsgrad för tillverkningsrecept och forskning.\n\nEnkel: 1000 vatten\nNormal: 1000 vatten, 1 sprängmedel\nSvår: 1000 vatten, 10 sprängmedel, 1 Processor.
Noxys_Waterfill-waterfillable=Anger vilka objekt som kan förstöras av vattenfyllning.\n\nInga: Inga objekt av något slag.\nGenererade: Endast naturligt genererade objekt, utom bitarobjekt.\nGenererade och bitare: Alla genererade objekt, inklusive bitare och deras nästen.\nAllt: Inga begränsningar alls.
Noxys_Waterfill-items-per-craft=Antal föremål som du får vid varje tillverkning.
Noxys_Waterfill-time-per-craft=Tidsåtgång per tillverkning (ett högre värde innebär långsammare tillverkning).
Noxys_Waterfill-reach-increase-while-holding-waterfill=När detta är aktiverat ökar din räckvidd medan du håller vattenfyllning. Det gör placeringen lättare och minskar risken att du dör genom att råka placera vatten under dig.
Noxys_Waterfill-reach-with-waterfill=Antal rutor som räckvidden ökar med när du håller vattenfyllning.
Noxys_Waterfill-water-per-deepwater=När detta värde är större än 1 kommer denna inställning åsidosätta djupvattensreceptet för att kräva den angivna mängden normal vattenfyllning som ingrediens.
Noxys_Waterfill-waterfill-recipe-override=Den här inställningen låter dig ersätta hela receptet för vattenfyllning.\n\n!!! VARNING !!!\n\nEtt fel i inställningen kan orsaka oväntade problem, så kontrollera att allt är rätt!\nSäkerhetskopiera filen `mod-settings.dat` innan du ändrar inställningen.\n\nFormatet är: type:item=amount\nDu kan lägga till flera poster genom att separera dem med kommatecken.\n\nExempel: fluid:water=1000,item:explosives=10,item:processing-unit=1\nDetta motsvarar den svåra receptnivån.
